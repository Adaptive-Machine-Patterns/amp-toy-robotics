[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-toy-robotics"
version = "0.1.0"
description = "A light, seed-generated benchmark for vision-language-action robot policies"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andy Whyte, Adaptive Machine Patterns Ltd", email = "amp@adaptive-machine-patterns.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10"]
keywords = ["robotics", "benchmark", "vision-language-action", "VLA", "imitation learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
packages = ["torch>=2.2", "safetensors>=0.4", "pyyaml>=6"]
test = ["pytest>=8"]

[project.scripts]
amp-bench = "amp_toy_robotics.cli:main"

[project.urls]
Homepage = "https://adaptive-machine-patterns.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: closed-loop runs over many scenes", "parity: compares against the lab snapshot"]
